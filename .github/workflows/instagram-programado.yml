# Publica a su hora los Reels de Instagram programados de AI Shorts (borradores de release `ig-<episodio>`).
# El Mac lo activa y lo lanza al programar; la ejecución espera dentro del trabajo y se relanza antes del límite de
# 6 h. El cron horario es sólo de respaldo (el de GitHub se retrasa o se omite). Se desactiva cuando no queda nada.
# Detalle: .github/scripts/instagram_programado.py
name: Instagram programado

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # leer borradores, publicarlos y borrar adjuntos
  actions: write    # relanzar el flujo y desactivarlo cuando no queda nada

concurrency:
  group: instagram-programado
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Publicar lo que toca
        env:
          GH_TOKEN: ${{ github.token }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 .github/scripts/instagram_programado.py
